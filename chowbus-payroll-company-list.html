<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 公司列表</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  [hidden]{display:none!important;}
  .page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .page-title{font-size:22px;font-weight:800;color:var(--t1);}
  .btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-add:hover{background:var(--brand-hover);}

  .list-card{background:var(--surface);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;}
  .tbl-wrap{overflow-x:auto;}
  table.co{width:100%;border-collapse:collapse;min-width:960px;}
  table.co thead th{font-size:13px;font-weight:500;color:#9ca3af;text-align:left;padding:13px 18px;background:#fafafa;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.co tbody td{padding:16px 18px;font-size:14px;color:var(--t1);border-bottom:1px solid #f1f2f4;vertical-align:top;}
  table.co tbody tr:last-child td{border-bottom:none;}
  table.co tbody tr:hover{background:#fcfcfd;}
  .c-ein{font-weight:700;font-variant-numeric:tabular-nums;}
  .c-mut{color:var(--t2);}
  .co-acts{display:flex;gap:8px;white-space:nowrap;}
  .act-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tb);cursor:pointer;}
  .act-btn:hover{border-color:var(--brand);color:var(--brand);}
  .act-btn.del:hover{border-color:#dc2626;color:#dc2626;}

  /* 弹窗 */
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:1200;}
  .ov.open{display:flex;}
  .modal{background:#fff;border-radius:16px;width:520px;max-width:calc(100vw - 40px);box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .m-h{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 4px;}
  .m-t{font-size:19px;font-weight:800;color:var(--t1);}
  .m-x{border:none;background:transparent;font-size:20px;color:var(--t2);cursor:pointer;}
  .m-body{padding:16px 26px 4px;}
  .m-fld{margin-bottom:15px;}
  .m-lb{font-size:13px;font-weight:700;color:var(--tb);margin-bottom:6px;display:block;}
  .m-lb .rq{color:var(--brand);}
  .m-inp{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font-size:14px;color:var(--t1);font-family:inherit;}
  .m-inp:focus{outline:none;border-color:var(--brand);}
  .m-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 26px 22px;}
  .m-foot button{border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  .m-cancel{background:#fff;border:1px solid #DCDCDC;color:var(--tb);}
  .m-save{background:var(--brand);border:1px solid var(--brand);color:#fff;}
  .m-save:hover{background:var(--brand-hover);}

  /* 删除确认 */
  .dl-modal{text-align:center;padding:28px 30px 22px;}
  .dl-ic{width:52px;height:52px;border-radius:50%;background:#FDECEC;color:#DC2626;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .dl-t{font-size:18px;font-weight:800;color:#111;margin-bottom:8px;}
  .dl-s{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:22px;}
  .dl-foot{display:flex;gap:12px;}
  .dl-foot button{flex:1;border-radius:10px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;}
  .dl-cancel{background:#fff;border:1px solid #DCDCDC;color:#374151;}
  .dl-confirm{background:#DC2626;border:1px solid #DC2626;color:#fff;}
  .dl-confirm:hover{background:#b91c1c;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:1500;transition:all .3s cubic-bezier(.2,.8,.3,1);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="page-head">
          <h1 class="page-title"><span class="zh">公司列表</span><span class="en">Company List</span></h1>
          <button class="btn-add" onclick="openAdd()"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg><span class="zh">添加公司</span><span class="en">Add company</span></button>
        </div>

        <div class="list-card">
          <div class="tbl-wrap">
            <table class="co">
              <thead><tr>
                <th>EIN Number</th>
                <th>Legal Name</th>
                <th>Trade Name</th>
                <th>Phone Number</th>
                <th>Address</th>
                <th><span class="zh">操作</span><span class="en">Action</span></th>
              </tr></thead>
              <tbody id="coBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 添加公司 弹窗 -->
<div class="ov" id="addOverlay">
  <div class="modal">
    <div class="m-h"><div class="m-t"><span class="zh">添加公司</span><span class="en">Add company</span></div><button class="m-x" onclick="closeAdd()">✕</button></div>
    <div class="m-body">
      <div class="m-fld"><label class="m-lb">EIN Number <span class="rq">*</span></label><input class="m-inp" id="aEin" placeholder="XX-XXXXXXX"></div>
      <div class="m-fld"><label class="m-lb">Legal Name <span class="rq">*</span></label><input class="m-inp" id="aLegal" placeholder="Legal entity name"></div>
      <div class="m-fld"><label class="m-lb">Trade Name</label><input class="m-inp" id="aTrade" placeholder="Doing-business-as name"></div>
      <div class="m-fld"><label class="m-lb">Phone Number</label><input class="m-inp" id="aPhone" placeholder="(000) 000-0000"></div>
      <div class="m-fld"><label class="m-lb">Address</label><input class="m-inp" id="aAddr" placeholder="Street, City, State, ZIP"></div>
    </div>
    <div class="m-foot"><button class="m-cancel" onclick="closeAdd()"><span class="zh">取消</span><span class="en">Cancel</span></button><button class="m-save" onclick="saveCompany()"><span class="zh">保存</span><span class="en">Save</span></button></div>
  </div>
</div>

<!-- 删除确认 -->
<div class="ov" id="delOverlay">
  <div class="modal dl-modal">
    <div class="dl-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></div>
    <div class="dl-t"><span class="zh">确认删除该公司？</span><span class="en">Delete this company?</span></div>
    <div class="dl-s"><span class="zh">将删除 <b id="delName"></b> 及其关联配置，该操作不可逆。</span><span class="en">This will remove <b id="delNameEn"></b> and its settings. This cannot be undone.</span></div>
    <div class="dl-foot"><button class="dl-cancel" onclick="closeDel()"><span class="zh">取消</span><span class="en">Cancel</span></button><button class="dl-confirm" onclick="confirmDel()"><span class="zh">删除</span><span class="en">Delete</span></button></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="cb-shell.js"></script>
<script>
  renderShell('companylist');
  function bi(zh,en){ return '<span class="zh">'+zh+'</span><span class="en">'+en+'</span>'; }

  let COMPANIES = (window.CB_COMPANIES||[]).map(c=>Object.assign({},c));
  function render(){
    document.getElementById('coBody').innerHTML = COMPANIES.map((c,i)=>
      '<tr>'+
        '<td class="c-ein">'+c.ein+'</td>'+
        '<td>'+c.legal+'</td>'+
        '<td class="c-mut">'+(c.trade||'—')+'</td>'+
        '<td class="c-mut">'+(c.phone||'—')+'</td>'+
        '<td class="c-mut">'+(c.addr||'—')+'</td>'+
        '<td><div class="co-acts"><button class="act-btn" onclick="location.href=\'chowbus-payroll-team-setup.html\'">'+bi('管理门店','Manage stores')+'</button>'+
          '<button class="act-btn del" onclick="askDel('+i+')">'+bi('删除','Delete')+'</button></div></td>'+
      '</tr>').join('');
  }
  render();

  function openAdd(){ ['aEin','aLegal','aTrade','aPhone','aAddr'].forEach(id=>document.getElementById(id).value=''); document.getElementById('addOverlay').classList.add('open'); }
  function closeAdd(){ document.getElementById('addOverlay').classList.remove('open'); }
  function saveCompany(){
    const ein=document.getElementById('aEin').value.trim();
    const legal=document.getElementById('aLegal').value.trim();
    if(!ein){ showToast('请填写 EIN Number','Please enter EIN'); return; }
    if(!legal){ showToast('请填写 Legal Name','Please enter legal name'); return; }
    COMPANIES.push({ein, legal, trade:document.getElementById('aTrade').value.trim(), phone:document.getElementById('aPhone').value.trim(), addr:document.getElementById('aAddr').value.trim()});
    closeAdd(); render(); showToast('公司已添加','Company added');
  }

  let delIdx=null;
  function askDel(i){ delIdx=i; document.getElementById('delName').textContent=COMPANIES[i].legal; document.getElementById('delNameEn').textContent=COMPANIES[i].legal; document.getElementById('delOverlay').classList.add('open'); }
  function closeDel(){ document.getElementById('delOverlay').classList.remove('open'); delIdx=null; }
  function confirmDel(){ if(delIdx!=null){ COMPANIES.splice(delIdx,1); } closeDel(); render(); showToast('公司已删除','Company deleted'); }

  function showToast(zh,en){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=document.body.classList.contains('lang-en')?en:zh; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
</script>
</body>
</html>
