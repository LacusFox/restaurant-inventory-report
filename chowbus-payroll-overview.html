<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 概览</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  /* 标题行 + 初始化流程入口（仅用于研发查看初始化交互） */
  .cb-titlerow{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .init-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-sub);border:1px solid var(--brand-muted);border-radius:8px;padding:7px 14px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .init-link:hover{background:#ffe1ec;}
  .init-link svg{flex-shrink:0;}

  /* ===== 概览：三张提醒卡 ===== */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .stat{background:var(--surface);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:18px 20px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
  .stat.due::before{background:var(--brand);}
  .stat.onb::before{background:var(--warning);}
  .stat.ts::before{background:var(--info);}
  .s-label{font-size:13px;color:var(--t2);font-weight:500;margin-bottom:12px;}
  .s-period{font-size:20px;font-weight:800;color:#111;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;margin:2px 0 12px;}
  .s-main{display:flex;align-items:baseline;gap:8px;}
  .s-num{font-size:32px;font-weight:700;line-height:1;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .stat.due .s-num{color:var(--brand);} .stat.onb .s-num{color:var(--warning);} .stat.ts .s-num{color:var(--info);}
  .s-unit{font-size:14px;color:var(--tb);font-weight:500;}
  .s-meta{font-size:12.5px;color:var(--t2);margin-top:10px;line-height:1.6;}
  .s-cta{margin-top:16px;align-self:flex-start;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
  .stat.due .s-cta{background:var(--brand);color:#fff;} .stat.due .s-cta:hover{background:var(--brand-hover);}
  .stat.onb .s-cta{background:#fff7ed;color:var(--warning);} .stat.onb .s-cta:hover{background:#feefd8;}
  .stat.ts .s-cta{background:#eff6ff;color:var(--info);} .stat.ts .s-cta:hover{background:#dbeafe;}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="cb-titlerow">
          <h1 class="cb-title"><span class="zh">薪酬概览</span><span class="en">Payroll Overview</span></h1>
          <button class="init-link" onclick="location.href='chowbus-payroll-overview-init.html'" title="仅用于研发查看初始化交互">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Z"/><path d="M10 3.5v1.8M10 14.7v1.8M16.5 10h-1.8M5.3 10H3.5M14.6 5.4l-1.3 1.3M6.7 13.3l-1.3 1.3M14.6 14.6l-1.3-1.3M6.7 6.7 5.4 5.4"/></svg>
            <span class="zh">初始化流程</span><span class="en">Setup Flow</span>
          </button>
        </div>

        <div class="stat-row">
          <div class="stat due">
            <div class="s-label"><span class="zh">最近发薪周期</span><span class="en">Most recent pay period</span></div>
            <div class="s-period">2026/8/4 – 2026/8/17</div>
            <div class="s-meta"><span class="zh">状态：<b style="color:var(--warning)">未完成跑薪</b></span><span class="en">Status: <b style="color:var(--warning)">Payroll not run</b></span></div>
            <button class="s-cta" onclick="location.href='chowbus-payroll-start-payroll.html'"><span class="zh">开始跑薪</span><span class="en">Run Payroll</span></button>
          </div>

          <div class="stat ts">
            <div class="s-label"><span class="zh">下个发薪周期</span><span class="en">Next pay period</span></div>
            <div class="s-period">2026/8/18 – 2026/8/31</div>
            <div class="s-meta"><span class="zh">距离下次跑薪还有 <b style="color:var(--info);font-size:22px;">3</b> 天</span><span class="en"><b style="color:var(--info);font-size:22px;">3</b> days until next payroll</span></div>
          </div>

          <div class="stat onb">
            <div class="s-label"><span class="zh">未完成 Onboard</span><span class="en">Pending onboarding</span></div>
            <div class="s-main"><span class="s-num">2</span><span class="s-unit zh">名员工</span><span class="s-unit en">employees</span></div>
            <div class="s-meta"><span class="zh">需完成资料填写后才能发薪</span><span class="en">They must finish onboarding before they can be paid</span></div>
            <button class="s-cta" onclick="location.href='chowbus-payroll-employees.html'"><span class="zh">去处理</span><span class="en">Resolve</span></button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="cb-shell.js"></script>
<script>renderShell('overview');</script>
</body>
</html>
