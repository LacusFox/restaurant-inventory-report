<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 员工资料</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  .crumb{font-size:13px;color:#9aa0aa;margin-bottom:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .crumb:hover{color:var(--brand);}

  /* 头部资料卡 */
  .d-head{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 26px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .d-name{font-size:24px;font-weight:800;color:var(--t1);margin-bottom:14px;}
  .d-meta{display:flex;flex-wrap:wrap;gap:14px 40px;font-size:14px;}
  .d-meta .item .k{color:var(--t2);} .d-meta .item .v{color:var(--t1);font-weight:600;margin-left:6px;}
  .d-badge{display:inline-block;font-weight:700;}
  .d-badge.green{color:#16a34a;} .d-badge.blue{color:#2b53c9;} .d-badge.amber{color:#d97706;}

  /* Tabs */
  .d-tabs{display:flex;gap:30px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .d-tab{padding:12px 2px;font-size:15px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;}
  .d-tab:hover{color:var(--t1);}
  .d-tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700;}

  /* 信息卡 */
  .d-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .d-sec-h{font-size:15px;font-weight:800;color:var(--t1);padding:18px 24px;background:#fafafa;border-bottom:1px solid var(--border);}
  .d-row{display:flex;padding:16px 24px;border-top:1px solid #f4f5f6;font-size:14.5px;}
  .d-row:first-of-type{border-top:none;}
  .d-row .k{width:180px;font-weight:700;color:#1a1a1a;flex-shrink:0;}
  .d-row .v{color:var(--t2);line-height:1.6;white-space:pre-line;}

  /* 税务文件 / 代扣项 */
  .d-doc{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid #f4f5f6;font-size:14.5px;}
  .d-doc:first-of-type{border-top:none;}
  .d-doc .dn{color:var(--t1);font-weight:600;}
  .d-doc .ds{font-size:12.5px;color:var(--t2);margin-top:3px;}
  .sign-pill{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:4px 11px;font-size:12.5px;font-weight:700;}
  .sign-pill.done{background:#e7f6ee;color:#12905a;}
  .sign-pill.todo{background:#fbf1dc;color:#9a6a12;}
  .d-act{color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;background:none;border:none;}
  .d-act:hover{text-decoration:underline;}
  .d-empty{padding:40px 24px;text-align:center;color:#9ca3af;font-size:14px;}

  .emp-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:1400;transition:all .3s cubic-bezier(.2,.8,.3,1);}
  .emp-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="crumb" onclick="location.href='chowbus-payroll-employees.html'">← <span class="zh">返回员工列表</span><span class="en">Back to employees</span></div>

        <!-- 头部 -->
        <div class="d-head">
          <div class="d-name" id="pName">—</div>
          <div class="d-meta">
            <span class="item"><span class="k"><span class="zh">邮箱</span><span class="en">Email</span>：</span><span class="v" id="pEmail"></span></span>
            <span class="item"><span class="k">Payroll ID：</span><span class="v" id="pPid"></span></span>
            <span class="item"><span class="k"><span class="zh">员工状态</span><span class="en">Employee Status</span>：</span><span class="v" id="pEstat"></span></span>
            <span class="item"><span class="k"><span class="zh">Payroll 状态</span><span class="en">Payroll Status</span>：</span><span class="v" id="pPstat"></span></span>
          </div>
        </div>

        <!-- Tabs -->
        <div class="d-tabs">
          <div class="d-tab on" data-t="pay" onclick="setTab('pay')"><span class="zh">员工薪资资料</span><span class="en">Payroll Profile</span></div>
          <div class="d-tab" data-t="ded" onclick="setTab('ded')"><span class="zh">税后代扣款项</span><span class="en">Post-tax Deductions</span></div>
          <div class="d-tab" data-t="tax" onclick="setTab('tax')"><span class="zh">税务文件签署</span><span class="en">Tax Documents</span></div>
        </div>

        <div id="tabPay"></div>
        <div id="tabDed" hidden></div>
        <div id="tabTax" hidden></div>

      </div>
    </div>
  </main>
</div>

<div class="emp-toast" id="empToast"><span id="empToastMsg"></span></div>

<script src="cb-shell.js"></script>
<script>
  renderShell('employees');
  function bi(zh,en){ return '<span class="zh">'+zh+'</span><span class="en">'+en+'</span>'; }
  function isEn(){ return document.body.classList.contains('lang-en'); }
  function empToast(zh,en){ const t=document.getElementById('empToast'); document.getElementById('empToastMsg').textContent=isEn()?en:zh; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }

  /* 与员工列表顺序一致 */
  const PROFILES=[
    {name:'Bohong Xu',   email:'qiyi.gong@chowbus.com', pid:'CB-100234', estat:['在职','Active','green'],  pstat:['发薪中','Paying','green'],
      dob:'4/25/1977', ssn:'XXX-XX-0000', addr:'2227 S Wentworth Ave,\nChicago, IL 60616', method:['银行代发','Direct deposit'], acct:['支票账户','Checking'], bank:'Chase Bank', acctNo:'••••1234', routing:'•••••6789'},
    {name:'Ruiqi Zhang', email:'ruiqi.zhang@chowbus.com', pid:'CB-100517', estat:['在职','Active','green'], pstat:['发薪中','Paying','green'],
      dob:'9/12/1990', ssn:'XXX-XX-0000', addr:'88 W Cermak Rd,\nChicago, IL 60616', method:['银行代发','Direct deposit'], acct:['支票账户','Checking'], bank:'Bank of America', acctNo:'••••7788', routing:'•••••3321'},
    {name:'司机 2号',    email:'driver2@chowbus.com',    pid:'CB-100538', estat:['在职','Active','green'], pstat:['资料待完善','Profile incomplete','amber'],
      dob:'—', ssn:'—', addr:'—', method:['—','—'], acct:['—','—'], bank:'—', acctNo:'—', routing:'—'},
    {name:'Wei Huang',   email:'wei.huang@chowbus.com',  pid:'CB-100329', estat:['在职','Active','green'], pstat:['发薪就绪','Ready','blue'],
      dob:'1/03/1982', ssn:'XXX-XX-0000', addr:'350 E Cermak Rd,\nChicago, IL 60616', method:['银行代发','Direct deposit'], acct:['支票账户','Checking'], bank:'Chase Bank', acctNo:'••••9910', routing:'•••••6789'},
    {name:'Yang Feng',   email:'yang.feng@chowbus.com',  pid:'CB-100604', estat:['在职','Active','green'], pstat:['暂未分配席位','No seat assigned','amber'],
      dob:'6/18/1995', ssn:'XXX-XX-0000', addr:'2211 S Wentworth Ave,\nChicago, IL 60616', method:['银行代发','Direct deposit'], acct:['储蓄账户','Savings'], bank:'Wells Fargo', acctNo:'••••2043', routing:'•••••1150'},
  ];
  const qi = parseInt(new URLSearchParams(location.search).get('i'));
  const P = PROFILES[(qi>=0&&qi<PROFILES.length)?qi:0];

  document.getElementById('pName').textContent=P.name;
  document.getElementById('pEmail').textContent=P.email;
  document.getElementById('pPid').textContent=P.pid;
  document.getElementById('pEstat').innerHTML='<span class="d-badge '+P.estat[2]+'">'+bi(P.estat[0],P.estat[1])+'</span>';
  document.getElementById('pPstat').innerHTML='<span class="d-badge '+P.pstat[2]+'">'+bi(P.pstat[0],P.pstat[1])+'</span>';

  function row(kZh,kEn,v){ return '<div class="d-row"><div class="k">'+bi(kZh,kEn)+'</div><div class="v">'+v+'</div></div>'; }

  document.getElementById('tabPay').innerHTML =
    '<div class="d-card">'+
      '<div class="d-sec-h">'+bi('基础信息','Basic Info')+'</div>'+
      row('姓名','Name',P.name)+
      row('出生日期','Date of Birth',P.dob)+
      row('SSN','SSN',P.ssn)+
      row('邮箱','Email',P.email)+
      row('居住地址','Home Address',P.addr)+
    '</div>'+
    '<div class="d-card">'+
      '<div class="d-sec-h">'+bi('收款信息','Payment Info')+'</div>'+
      row('收款方式','Payment Method',bi(P.method[0],P.method[1]))+
      row('账户类型','Account Type',bi(P.acct[0],P.acct[1]))+
      row('开户银行','Bank',P.bank)+
      row('账号','Account Number',P.acctNo)+
      row('Routing Number','Routing Number',P.routing)+
    '</div>';

  document.getElementById('tabDed').innerHTML =
    '<div class="d-card"><div class="d-sec-h">'+bi('税后代扣款项','Post-tax Deductions')+'</div>'+
      '<div class="d-empty">'+bi('暂无税后代扣款项','No post-tax deductions')+'</div></div>';

  const DOCS=[
    ['W-4（联邦预扣）','W-4 (Federal withholding)','已签署','Signed','done'],
    ['IL-W-4（伊利诺伊州预扣）','IL-W-4 (Illinois withholding)','已签署','Signed','done'],
    ['Form 8655（报税授权）','Form 8655 (Reporting Agent Auth.)','待签署','Pending','todo'],
  ];
  document.getElementById('tabTax').innerHTML =
    '<div class="d-card"><div class="d-sec-h">'+bi('税务文件签署','Tax Documents')+'</div>'+
      DOCS.map(d=>'<div class="d-doc"><div><div class="dn">'+bi(d[0],d[1])+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:16px;"><span class="sign-pill '+d[4]+'">'+bi(d[2],d[3])+'</span>'+
        '<button class="d-act" onclick="empToast(\'打开文件（示意）\',\'Opening document\')">'+bi(d[4]==='done'?'查看':'去签署', d[4]==='done'?'View':'Sign')+'</button></div></div>').join('')+
    '</div>';

  function setTab(t){
    document.querySelectorAll('.d-tab').forEach(el=>el.classList.toggle('on', el.dataset.t===t));
    document.getElementById('tabPay').hidden = t!=='pay';
    document.getElementById('tabDed').hidden = t!=='ded';
    document.getElementById('tabTax').hidden = t!=='tax';
  }
</script>
</body>
</html>
