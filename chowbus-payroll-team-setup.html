<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · Team Setup</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  .cb-scroll{background:#fff;}
  .ts-wrap{max-width:1180px;margin:0 auto;padding:8px 4px 40px;}
  .crumb{font-size:13px;color:#9aa0aa;margin-bottom:18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .crumb:hover{color:#2b4eff;}

  .ts-banner{display:flex;gap:14px;background:#EEF3FF;border:1px solid #D7E3FF;border-radius:12px;padding:16px 20px;margin-bottom:30px;}
  .ts-banner .bic{color:#2b4eff;flex-shrink:0;margin-top:2px;}
  .ts-banner .bt{font-size:16px;font-weight:800;color:#1b2a5c;}
  .ts-banner .bs{font-size:14px;color:#3f5488;margin-top:4px;line-height:1.5;}

  .ts-h{font-size:26px;font-weight:800;color:#111;}
  .ts-cnt{font-size:14px;color:#6b7280;margin:6px 0 18px;}
  .ts-add{display:inline-flex;align-items:center;gap:8px;background:#2b4eff;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:700;cursor:pointer;margin-bottom:24px;}
  .ts-add:hover{background:#2140db;}

  table.ts-tbl{width:100%;border-collapse:collapse;}
  table.ts-tbl thead th{font-size:14px;font-weight:800;color:#111;text-align:left;padding:12px 14px;border-bottom:1px solid #E7E8EC;white-space:nowrap;}
  table.ts-tbl tbody td{padding:16px 14px;font-size:14.5px;color:#111;border-bottom:1px solid #F1F2F4;}
  table.ts-tbl tbody td.idx{color:#9aa0aa;}
  .ts-empty-a2{color:#c4c8cf;}

  .ts-foot{display:flex;align-items:center;justify-content:flex-end;gap:22px;margin-top:34px;padding-top:20px;border-top:1px solid #EFF0F3;}
  .ts-conf{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:#374151;cursor:pointer;}
  .ts-conf input{width:18px;height:18px;accent-color:#2b4eff;}
  .ts-cont{display:inline-flex;align-items:center;gap:8px;background:#2b4eff;color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  .ts-cont:disabled{background:#A9B8FF;cursor:not-allowed;}
  .ts-cont:not(:disabled):hover{background:#2140db;}

  /* Add workplace 弹窗 */
  .wk-ov{position:fixed;inset:0;background:rgba(20,22,30,.5);display:none;align-items:center;justify-content:center;z-index:1300;padding:24px;}
  .wk-ov.open{display:flex;}
  .wk-modal{background:#fff;border-radius:16px;width:660px;max-width:calc(100vw - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:28px 30px 30px;}
  .wk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .wk-t{font-size:22px;font-weight:800;color:#111;}
  .wk-x{width:34px;height:34px;border:1px solid #D7E3FF;border-radius:9px;background:#fff;color:#2b4eff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .wk-lb{font-size:15px;font-weight:800;color:#111;margin-bottom:3px;display:block;}
  .wk-lb .rq{color:#e0455e;}
  .wk-desc{font-size:13.5px;color:#8a8f9a;margin-bottom:9px;}
  .wk-input,.wk-select{width:100%;padding:13px 14px;border:1px solid #DADCE0;border-radius:10px;font-size:14.5px;background:#fff;color:#111;font-family:inherit;margin-bottom:14px;}
  .wk-input:focus,.wk-select:focus{outline:none;border-color:#2b4eff;box-shadow:0 0 0 3px rgba(43,78,255,.12);}
  .wk-sec{font-size:15px;font-weight:800;color:#111;margin:8px 0 9px;}
  .wk-row2{display:grid;grid-template-columns:1fr 150px;gap:12px;}
  .wk-save{width:100%;background:#2b4eff;color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .wk-save:hover{background:#2140db;}
  .ts-savebar{display:flex;justify-content:flex-end;margin-top:34px;padding-top:20px;border-top:1px solid #EFF0F3;}
  .ts-save{display:inline-flex;align-items:center;gap:8px;background:#2b4eff;color:#fff;border:none;border-radius:10px;padding:13px 30px;font-size:15px;font-weight:700;cursor:pointer;}
  .ts-save:hover{background:#2140db;}
  /* 联系专属顾问 弹窗 */
  .ad-modal{position:relative;width:520px;text-align:center;padding:34px 34px 28px;}
  .ad-t{font-size:24px;font-weight:800;color:#111;margin-bottom:8px;}
  .ad-sub{font-size:13.5px;color:#6b7280;line-height:1.6;margin-bottom:22px;}
  .ad-card{display:flex;align-items:center;gap:16px;border:1px solid #E7E8EC;border-radius:14px;padding:18px 20px;text-align:left;margin-bottom:22px;}
  .ad-avatar{width:48px;height:48px;border-radius:50%;background:#FBE3C4;color:#C98A3E;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ad-name{font-size:16px;font-weight:700;color:#111;}
  .ad-email{font-size:14px;color:#6b7280;margin-top:3px;}
  .ad-confirm{background:var(--brand,#e00051);color:#fff;border:none;border-radius:10px;padding:13px 44px;font-size:15px;font-weight:700;cursor:pointer;}
  .ad-confirm:hover{background:var(--brand-hover,#b80042);}
  .ts-match{border:1px solid #C7D2FE;background:#F5F7FF;color:#2b4eff;border-radius:8px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .ts-match:hover{background:#e9eeff;}

  /* 匹配员工 弹窗 */
  .me-modal{background:#fff;border-radius:16px;width:520px;max-width:calc(100vw - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35);}
  .me-h{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 4px;}
  .me-t{font-size:19px;font-weight:800;color:#111;}
  .me-sub{padding:6px 26px 0;font-size:13.5px;color:#6b7280;}
  .me-list{padding:14px 26px 6px;max-height:340px;overflow-y:auto;}
  .me-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #F1F2F4;font-size:14.5px;color:#111;cursor:pointer;}
  .me-row:last-child{border-bottom:none;}
  .me-cb{width:19px;height:19px;border:1.7px solid #c4c8cf;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
  .me-row.on .me-cb{background:#2b4eff;border-color:#2b4eff;}
  .me-role{margin-left:auto;font-size:12.5px;color:#9ca3af;}
  .me-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 26px 22px;}
  .me-foot button{border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  .me-cancel{background:#fff;border:1px solid #DCDCDC;color:#374151;}
  .me-save2{background:#2b4eff;border:1px solid #2b4eff;color:#fff;}
  .me-save2:hover{background:#2140db;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:1500;transition:all .3s cubic-bezier(.2,.8,.3,1);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="ts-wrap">
          <div class="crumb" onclick="cbNav('chowbus-payroll-company-setup.html')">← <span class="zh">返回公司设置</span><span class="en">Back to Company Setup</span></div>

          <div class="ts-h">My Workplaces</div>
          <div class="ts-cnt" id="tsCnt">0 workplaces</div>
          <button class="ts-add" onclick="openWk()"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>Add workplace</button>

          <div style="overflow-x:auto;">
            <table class="ts-tbl">
              <thead><tr>
                <th>#</th><th>Name</th><th>Restaurant ID</th><th>Address line 1</th><th>Address line 2</th><th>City</th><th>State</th><th>ZIP</th>
              </tr></thead>
              <tbody id="tsBody"></tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<!-- 联系专属顾问 弹窗（工作地点由 CSM 维护） -->
<div class="wk-ov" id="wkOverlay">
  <div class="wk-modal ad-modal">
    <button class="wk-x" onclick="closeWk()" style="position:absolute;top:18px;right:20px;">✕</button>
    <div class="ad-t"><span class="zh">联系您的专属顾问</span><span class="en">Contact Your Dedicated Advisor</span></div>
    <div class="ad-sub"><span class="zh">工作地点由您的专属顾问（CSM）为您维护。如需新增，请联系 TA。</span><span class="en">Workplaces are maintained by your dedicated advisor (CSM). To add one, please reach out to them.</span></div>
    <div class="ad-card">
      <div class="ad-avatar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0" stroke-linecap="round"/></svg></div>
      <div class="ad-info">
        <div class="ad-name" id="adName">—</div>
        <div class="ad-email" id="adEmail">—</div>
      </div>
    </div>
    <button class="ad-confirm" onclick="adConfirm()"><span class="zh">确认</span><span class="en">Confirm</span></button>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="cb-shell.js"></script>
<script>
  renderShell('company');

  /* 系统内的 Location（含 Restaurant ID 与地址），供 Location Mapping 下拉匹配 */
  const LOCATIONS=[
    {loc:'Curry Flurry - Chicago Loop', rid:'12555', a1:'200 W Madison St',   a2:'Suite 100', city:'Chicago',    state:'IL', zip:'60606'},
    {loc:'Curry Flurry - Chinatown',    rid:'12300', a1:'2227 S Wentworth Ave',a2:'',          city:'Chicago',    state:'IL', zip:'60616'},
    {loc:'Curry Flurry - Naperville',   rid:'12811', a1:'55 S Main St',        a2:'',          city:'Naperville', state:'IL', zip:'60540'},
    {loc:'Curry Flurry - Evanston',     rid:'12902', a1:'1620 Orrington Ave',  a2:'',          city:'Evanston',   state:'IL', zip:'60201'},
  ];
  let WORKPLACES=[
    {name:'200 W Madison St', rid:'12555', a1:'200 W Madison St', a2:'Suite 100', city:'Chicago', state:'IL', zip:'60606'},
    {name:'moli', rid:'12300', a1:'2227 S Wentworth Ave, Chicago, IL 60616', a2:'', city:'Port Vern', state:'IL', zip:'60616'},
  ];
  function tsRender(){
    document.getElementById('tsCnt').textContent = WORKPLACES.length + ' workplace' + (WORKPLACES.length===1?'':'s');
    document.getElementById('tsBody').innerHTML = WORKPLACES.map((w,i)=>
      '<tr><td class="idx">'+(i+1)+'</td><td>'+w.name+'</td><td>'+(w.rid||'—')+'</td><td>'+w.a1+'</td><td'+(w.a2?'':' class="ts-empty-a2"')+'>'+(w.a2||'—')+'</td><td>'+w.city+'</td><td>'+w.state+'</td><td>'+w.zip+'</td></tr>').join('');
  }
  tsRender();

  /* Save：从初始化流程进入 → 标记完成并回到初始化，跳到下一步；否则回公司设置 */
  function tsSave(){
    const fromInit = new URLSearchParams(location.search).get('from')==='init';
    try{ if(fromInit){ localStorage.setItem('cbInitWorkplace','1'); localStorage.setItem('cbInitAuto','1'); } }catch(e){}
    showToast('工作地点已保存');
    const go = window.cbNav||function(u){location.href=u;};
    setTimeout(()=> go(fromInit ? 'chowbus-payroll-overview-init.html' : 'chowbus-payroll-company-setup.html'), 700);
  }

  /* 工作地点由 CSM 维护，客户不可自助新增 → 点击 Add workplace 弹出「联系专属顾问」 */
  const ADVISOR={ name:'Jessica Wang', email:'jessica.wang@chowbus.com' };
  function openWk(){
    document.getElementById('adName').textContent=ADVISOR.name;
    document.getElementById('adEmail').textContent=ADVISOR.email;
    document.getElementById('wkOverlay').classList.add('open');
  }
  function closeWk(){ document.getElementById('wkOverlay').classList.remove('open'); }
  function adConfirm(){ closeWk(); showToast('已通知您的专属顾问，将尽快为您添加'); }

  function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
</script>
</body>
</html>
