<style>

  .main{max-width:680px;margin:0 auto;padding:34px 30px 90px;}

  .side-h.mt{margin-top:22px;}
  .grp{margin:0 0 4px;} .grp>.g-head{font-weight:700;color:#3f4a52;display:flex;gap:5px;align-items:flex-start;padding:3px 0;}

  .cb{display:inline-block;width:11px;height:11px;border:1.5px solid #7d8890;border-radius:2px;margin-top:2px;}

  h2.q{font-size:21px;font-weight:700;margin:0 0 22px;line-height:1.35;text-align:center;color:#2b333a;}
  .center{text-align:center;} p.lead{color:#4a555d;line-height:1.6;}
  .disp{font-family:Georgia,serif;color:var(--blue);}
  h1.big{font-family:Georgia,serif;color:var(--blue);font-size:56px;font-weight:400;margin:6px 0 10px;}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0;}
  .info{background:var(--info-bg);border:1px solid var(--info-bd);border-radius:8px;padding:14px 16px;display:flex;gap:10px;color:#40525e;line-height:1.55;font-size:14px;margin:16px 0;}
  .info .i{flex:none;width:18px;height:18px;border-radius:50%;background:#3b82c4;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-style:italic;margin-top:1px;}
  .info b{color:#33454f;}
  label.f{display:block;font-size:14px;color:#3f4a52;margin:14px 0 5px;} label.f .hint{color:#9aa3aa;font-weight:400;}
  input.t,select.t{width:100%;padding:10px 12px;border:1px solid #c9d0d6;border-radius:6px;font-size:15px;background:#fff;color:#2f3a42;}
  input.t:focus,select.t:focus{outline:none;border-color:#5b93c8;box-shadow:0 0 0 3px rgba(91,147,200,.18);}
  input.t:disabled{background:#eef1f3;color:#6b7680;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;} .grid4{display:grid;grid-template-columns:1.4fr .9fr .8fr .8fr;gap:12px;}
  .qmark{display:inline-block;width:15px;height:15px;border-radius:50%;background:#3b82c4;color:#fff;font-size:10px;text-align:center;line-height:15px;margin-left:5px;font-weight:700;}
  .pills{display:flex;justify-content:center;margin:6px 0 18px;}
  .pills .p{border:1px solid #c7d3cb;border-left:none;padding:7px 16px;cursor:pointer;background:#eef3ef;color:#3f4a52;font-size:14px;}
  .pills .p:first-child{border-left:1px solid #c7d3cb;border-radius:16px 0 0 16px;} .pills .p:last-child{border-radius:0 16px 16px 0;}
  .pills .p.sel{background:var(--pillsel);border-color:var(--pillsel-bd);color:#2c4a30;font-weight:600;}
  .radio{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;color:#3f4a52;} .radio input{accent-color:#2f6fb0;}
  .imp{color:#3b6ea5;font-weight:600;margin-left:8px;font-size:13px;}
  .btns{display:flex;justify-content:center;gap:14px;margin-top:34px;align-items:center;flex-wrap:wrap;}
  .btn{border-radius:22px;padding:9px 20px;font-size:14px;cursor:pointer;background:#fff;border:1px solid #b9c2c8;color:#4a555d;} .btn:hover{background:#f6f8f9;}
  .btn.primary{background:var(--sage);border-color:var(--sage);color:#22403a;font-weight:600;} .btn.primary:hover{background:#88a89d;}
  .btn.blue{border-color:#5b93c8;color:#3b6ea5;} .btn.sm{padding:6px 16px;}
  .link{color:#3b6ea5;text-decoration:underline;cursor:pointer;font-size:14px;} a.inl{color:#3b6ea5;}
  .ms{display:flex;gap:22px;align-items:flex-start;margin:30px 0;} .ms .txt{flex:1;}
  .ms h3{font-family:Georgia,serif;color:var(--blue);font-size:23px;font-weight:400;margin:0 0 8px;}
  .ms .req{color:#8a949c;font-size:13px;margin:10px 0 4px;} .ms ul{margin:4px 0 0;padding-left:18px;color:#4a555d;line-height:1.7;}
  .circ{width:120px;height:120px;border-radius:50%;background:#dfeee7;flex:none;display:flex;align-items:center;justify-content:center;font-size:44px;}
  .medal{width:88px;height:88px;border-radius:50%;background:#f4d03f;margin:6px auto 14px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 6px 16px rgba(0,0,0,.12);}
  .ltable{border:1px solid #e0e5e8;border-radius:8px;overflow:hidden;margin:14px 0;}
  .ltable .th{display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;border-bottom:1px solid #eceff1;}
  .lrow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f2f4;background:#fafbfc;} .lrow:last-child{border-bottom:none;}
  .lrow .nm{display:flex;flex-direction:column;} .lrow .warn{color:#c0392b;font-size:12.5px;margin-top:2px;}
  .trash{color:#4a90d9;cursor:pointer;margin-right:8px;}
  .addrow{display:flex;gap:10px;align-items:center;margin-top:12px;} .addrow input{flex:none;width:230px;}
  .err{color:#c0392b;font-size:13px;text-align:center;margin-top:8px;}
  .acc{border:1px solid #e0e5e8;border-radius:8px;padding:16px 18px;margin:12px 0;}
  .acc .ah{display:flex;justify-content:space-between;align-items:center;} .acc .ah b{font-size:16px;}
  .noaddr{color:#c0392b;font-size:14px;margin-top:8px;} .addr-txt{color:#5b656d;font-size:14px;line-height:1.5;margin-top:8px;}
  .loc-cap{margin:20px 0 8px;font-weight:600;color:#3f4a52;display:flex;align-items:center;gap:6px;}
  .sub{font-weight:700;color:#3f4a52;margin:18px 0 4px;} .jobin{margin:0 0 12px;}
  .review-loc{margin:18px 0 6px;font-weight:400;font-size:18px;color:#3f4a52;display:flex;gap:8px;align-items:center;} .review-loc .cv{color:#6b7680;font-size:13px;}
  .review-jobs{color:#5b656d;line-height:1.9;padding-left:22px;} .rule{border-top:1px solid #cfd6db;margin:10px 0;}
  .progress{position:absolute;left:0;right:0;bottom:0;height:6px;background:#e6eaed;} .progress .fill{height:100%;background:var(--orange);transition:width .25s;}
  .notebar{background:var(--orange);color:#fff;font-size:12.5px;line-height:1.4;padding:9px 20px;text-align:center;}
  .overlay{position:fixed;inset:0;background:rgba(40,48,54,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto;}
  .modal{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 4px;font-size:18px;} .modal .mbtns{display:flex;justify-content:flex-end;gap:16px;align-items:center;margin-top:20px;}
  .opt2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:10px 0;}
  .optcard{border:1px solid #d3dae0;border-radius:8px;padding:16px;} .optcard.pref{border-color:#5b93c8;}
  .optcard .ttl{color:#5b656d;font-size:14px;margin-bottom:8px;}
  .sigbox{border:1px solid #c9d0d6;border-radius:6px;height:120px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;}
  .sigbox .clr{position:absolute;right:10px;bottom:6px;color:#3b6ea5;font-size:12px;cursor:pointer;}
  .plaid-intro{background:#eef2fb;border-radius:10px;max-width:330px;width:100%;padding:0 0 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;}
  .plaid-intro .bar{height:8px;background:#2f6fb0;} .plaid-intro .body{padding:20px 22px;}
  .plaid-intro p{color:#33507a;margin:0 0 16px;line-height:1.5;}
  .plaid-connect{background:#2f6fb0;color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .plaid-cancel{display:block;margin:12px auto 0;border:1px solid #c0392b;color:#c0392b;background:#fff;border-radius:18px;padding:6px 20px;cursor:pointer;}
  .plaid-inst{background:#fff;border-radius:10px;max-width:430px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;}
  .plaid-inst .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;} .plaid-inst .ph .x{cursor:pointer;color:#666;font-size:18px;}
  .plaid-inst .pb{padding:0 18px 20px;} .plaid-inst h4{margin:0 0 12px;font-size:19px;}
  .plaid-search{width:100%;padding:10px 12px;border:1px solid #d3dae0;border-radius:8px;background:#f7f8fa;}
  .banks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;max-height:300px;overflow:auto;}

<div class="topbar"><h1 class="serif">The Fishermans Son Setup</h1><div class="toprt"><span class="langtog" id="langtog"></span><span class="link" onclick="resetAll()" id="resetlink"></span></div></div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-wrap"><div class="main" id="main"></div><div class="progress"><div class="fill" id="pfill"></div></div></div>
</div>
<div id="note"></div>
<div id="modal"></div>

<script>
const STEPS=['welcome','tax1','tax2','tax3','tax4','tax5','tax_done','loc1','loc2','loc_worktax','loc_jobs','loc_reviewjobs','loc_done','pay1','pay2','pay3','pay4','pay_congrats','pay_ready'];
const JOBS5=['Server','Bartender','Host','Barback','Manager'];
const state={step:'welcome',lang:'zh',fein:1,stategrp:1,paid:null,payGroups:1,plaid:null,editLoc:null,
  locations:[{name:'Down Town',company:null,addr:null,jobs:[...JOBS5]},{name:'Lighthouse Road',company:null,addr:null,jobs:['','','']}]};
const ADDR_DEF={0:{line1:'23 Main Street',city:'Scituate',state:'Massachusetts',zip:'02066'},1:{line1:'1 Lighthouse Road',city:'Scituate',state:'Massachusetts',zip:'02066'}};
function L(en,zh){return state.lang==='zh'?zh:en;}
const idx=()=>STEPS.indexOf(state.step);
function go(s){state.step=s;render();window.scrollTo(0,0);}
function next(){const i=idx();if(i<STEPS.length-1)go(STEPS[i+1]);}
function prev(){const i=idx();if(i>0)go(STEPS[i-1]);}
function setFein(n){state.fein=n;render();} function setGrp(n){state.stategrp=n;render();} function setPaid(v){state.paid=v;render();} function setPG(n){state.payGroups=n;render();}
function setLang(l){state.lang=l;render();}
function addLoc(){const el=document.getElementById('newloc');const v=(el.value||'').trim();if(!v)return;state.locations.push({name:v,company:null,addr:null,jobs:['','','']});render();}
function delLoc(i){state.locations.splice(i,1);render();}
function assign(i){state.locations[i].company='The Fishermans Son';render();}
function openEdit(i){state.editLoc=i;render();} function cancelEdit(){state.editLoc=null;render();}
function saveEdit(){const i=state.editLoc,g=id=>document.getElementById(id).value;state.locations[i].addr={line1:g('a1'),line2:g('a2'),city:g('ac'),state:g('as'),zip:g('az')};state.editLoc=null;render();}
function collectJobs(){state.locations.forEach((l,li)=>{const ins=document.querySelectorAll('[data-loc="'+li+'"]');if(ins.length){l.jobs=[...ins].map(x=>x.value);}});}
function addJob(li){collectJobs();state.locations[li].jobs.push('');render();}
function openPlaid(){state.plaid='intro';render();} function plaidConnect(){state.plaid='inst';render();} function closePlaid(){state.plaid=null;render();}

/* SIDEBAR */
function ic(st){return st==='done'?'<span class="ic">✓</span>':st==='active'?'<span class="ic"><span class="cb"></span></span>':'<span class="ic">🔒</span>';}
function leaf(l,st){return `<div class="leaf ${st}">${ic(st)}<span>${l}</span></div>`;}
function sf(i,a){return i<a?'done':i===a?'active':'locked';}
function renderSidebar(){
  const s=state.step,i=idx();
  const inLoc=['loc2','loc_worktax','loc_jobs','loc_reviewjobs','loc_done'].includes(s);
  const inPay=['pay1','pay2','pay3','pay4','pay_congrats','pay_ready'].includes(s);
  const taxDone=i>=STEPS.indexOf('tax_done');
  let h='';
  h+=`<div class="side-h">${L('Tax Information','税务信息')}</div>`;
  if(inLoc||inPay){
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Basic Company Information','公司基础信息')}</div></div>`;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Federal Tax Accounts','联邦税务账户')}</div></div>`;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('State Tax Accounts','州税务账户')}</div></div>`;
  }else{
    const A=(s==='loc1'||taxDone)?99:(s==='tax1'?0:s==='tax2'?1:s==='tax3'?2:s==='tax4'?3:s==='tax5'?4:-1);
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Basic Company Information','公司基础信息')}</div>`+leaf(L('Review Company Code','确认 Company Code'),sf(0,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Federal Tax Accounts','联邦税务账户')}</div>`+leaf(L('Add FEINs','添加 FEIN'),sf(1,A))+leaf(L('FEIN Details','FEIN 详情'),sf(2,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('State Tax Accounts','州税务账户')}</div>`+leaf(L('Add State Tax Accounts','添加州税务账户'),sf(3,A))+leaf(L('State Tax Account Details','州税务账户详情'),sf(4,A))+'</div>';
  }
  h+=`<div class="side-h mt">${L('Locations &amp; Jobs','门店与岗位')}</div>`;
  if(inLoc){
    const A=s==='loc2'?1:s==='loc_worktax'?2:s==='loc_jobs'?3:s==='loc_reviewjobs'?4:99;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Companies','公司')}</div>`+leaf(L('Connect Companies to FEINs','关联公司与 FEIN'),sf(0,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Locations','门店')}</div>`+leaf(L('Assign &amp; Add Locations','分配与添加门店'),sf(1,A))+leaf(L('Work Tax Locations','工作税务地点'),sf(2,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Jobs','岗位')}</div>`+leaf(L('Add Jobs','添加岗位'),sf(3,A))+leaf(L('Review Jobs','复核岗位'),sf(4,A))+'</div>';
  }else{
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Companies','公司')}</div></div>`;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Locations','门店')}</div></div>`;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Jobs','岗位')}</div></div>`;
  }
  h+=`<div class="side-h mt">${L('Payroll','薪酬')}</div>`;
  if(inPay){
    const A=s==='pay1'?0:s==='pay2'?1:(s==='pay_congrats'||s==='pay_ready')?99:2;
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Pay Groups','发薪组')}</div>`+leaf(L('Create Pay Groups','创建发薪组'),sf(0,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Payroll Calendars','发薪日历')}</div>`+leaf(L('Create Payroll Calendars','创建发薪日历'),sf(1,A))+'</div>';
    h+=`<div class="grp"><div class="g-head"><span class="caret">▼</span>${L('Bank Info','银行信息')}</div>`+leaf(L('Provide Bank Account','提供银行账户'),sf(2,A))+'</div>';
  }else{
    h+=`<div class="grp"><div class="g-head"><span class="caret">▶</span>${L('Pay Groups','发薪组')}</div></div>`;
  }
  document.getElementById('sidebar').innerHTML=h;
}

/* HELPERS */
function pills(list,cur,setter){let h='<div class="pills">';list.forEach(n=>{const lbl=(n==='More')?L('More','更多'):n;h+=`<div class="p ${n===cur?'sel':''}" onclick="${setter}('${n}')">${lbl}</div>`;});return h+'</div>';}
function nav(save){return `<div class="btns"><button class="btn" onclick="prev()">← ${L('Previous question','上一步')}</button><button class="btn primary" onclick="next()">${save}</button></div>`;}
function BTN(){return {save:L('Save and continue →','保存并继续 →'),cont:L('Continue →','继续 →'),skip:L("I'm not sure, skip for now.",'暂不确定,先跳过。'),dash:L('Return to dashboard','返回仪表盘'),begin:L('Begin first step','开始第一步'),nextm:L('Next milestone','下一里程碑')};}

function numOf(v){return v==='More'?6:(parseInt(v)||1);}
function feinBlock(i){const f=i===0;
  return `<div class="sub" style="font-size:16px;">FEIN ${i+1}</div><hr style="margin:10px 0 18px;">
    <div class="grid2"><div><label class="f">${L('Business Legal Name','公司法定名称')} <span class="qmark">?</span></label><input class="t" value="${f?'Fishermans Son Inc':''}" placeholder="${L('Legal name','法定名称')}"></div><div><label class="f">${L('Doing Business As Name (DBA)','经营名称(DBA)')} <span class="qmark">?</span></label><input class="t" value="${f?'The Fishermans Son':''}" placeholder="DBA"></div></div>
    <label class="f">${L('Federal Employer Identification Number (FEIN)','联邦雇主识别号(FEIN)')} <span class="qmark">?</span></label><input class="t" value="${f?'00-0000000':''}" placeholder="00-0000000">
    <label class="f">${L('Registration Status','注册状态')}</label><select class="t"><option>${L('Registered','已注册')}</option><option>${L('Applied for','已申请')}</option></select>
    <label class="f">${L('Address Line 1','地址第 1 行')} <span class="qmark">?</span></label><input class="t" value="${f?'1 Lighthouse Road':''}">
    <label class="f">${L('Address Line 2','地址第 2 行')} <span class="hint">- ${L('optional','可选')}</span></label><input class="t" value="${f?'Unit C':''}">
    <div class="grid4" style="margin-top:14px;"><div><label class="f" style="margin-top:0;">${L('City','城市')}</label><input class="t" value="${f?'Scitaute':''}"></div><div><label class="f" style="margin-top:0;">${L('State','州')}</label><select class="t"><option>Massachusetts</option><option>Illinois</option><option>California</option></select></div><div><label class="f" style="margin-top:0;">${L('Zip Code','邮编')}</label><input class="t" value="${f?'02066':''}"></div><div><label class="f" style="margin-top:0;">${L('Country','国家')}</label><input class="t" value="USA"></div></div>`;}
function stateGrpBlock(i){const f=i===0;
  return `<div class="sub" style="font-size:16px;">${L('State Tax Account Group','州税务账户组')} ${i+1}</div><hr style="margin:10px 0 16px;">
    <label class="f">${L('State','州')} <span class="qmark">?</span></label><select class="t"><option>Massachusetts</option><option>Illinois</option><option>California</option></select>
    <label class="f">${L('Associated FEIN','关联 FEIN')}</label><select class="t"><option>00-0000000 (Fishermans Son Inc)</option></select>
    <div class="sub">${L('State Withholding Account Information','州预扣账户信息')}</div>
    <label class="f">${L('Registration Status','注册状态')} <span class="qmark">?</span></label><select class="t"><option>${L('Registered','已注册')}</option><option>${L('Applied for','已申请')}</option></select>
    <label class="f">${L('Account Number','账号')}</label><input class="t" value="${f?'646-784-316':''}" placeholder="646-784-316">

      <label class="radio"><input type="radio" name="exempt" checked> ${L('Exempt. I do not earn overtime','豁免。我不获得加班费')}</label>

  if(s==='pay_congrats') return `<div class="medal">🏅</div>
    <h1 class="disp center" style="font-size:32px;font-weight:400;margin:0 0 14px;line-height:1.3;">${L('Congratulations! You just finished your implementation process.','恭喜!你已完成实施流程。')}</h1>
    <p class="lead center">${L('If you are ready to save and complete your implementation, click the button below.','如果你已准备好保存并完成实施,请点击下方按钮。')}</p>
    <div class="btns"><button class="btn" onclick="prev()">← ${L('Previous question','上一步')}</button><button class="btn primary" onclick="next()">${L('Complete Setup','完成设置')}</button></div>
    <div class="center" style="margin-top:14px;"><button class="btn" onclick="go('welcome')">${B.dash}</button></div>`;

  if(s==='pay_ready') return `
    <h1 class="disp center" style="font-size:36px;font-weight:400;margin:10px 0 4px;">${L('Your Toast Payroll account is almost ready.','你的 Toast Payroll 账户即将就绪。')}</h1>

    <p class="lead center" style="font-size:19px;">${L('Someone from our team will reach out to you soon (1 - 2 business days) with your next steps.','我们的团队将很快(1–2 个工作日)与你联系,告知后续步骤。')}</p>

    <div class="center" style="margin-top:24px;"><button class="btn" onclick="go('welcome')">${B.dash}</button></div>`;

  return `<div class="medal">🏅</div>
    <h1 class="disp center" style="font-size:34px;font-weight:400;margin:0 0 8px;">${title}</h1><hr>
    <div class="center" style="color:#8a949c;font-style:italic;margin-bottom:4px;">${L('Next Up','下一步')}</div>
    <div class="center" style="font-weight:700;font-size:18px;margin-bottom:8px;">${nextUp}</div>
    <div class="btns"><button class="btn" onclick="prev()">← ${L('Previous question','上一步')}</button><button class="btn primary" onclick="next()">${B.nextm}</button></div>
    <div class="center" style="margin-top:14px;"><button class="btn" onclick="go('welcome')">${B.dash}</button></div>`;}
function abbr(st){return st==='Massachusetts'?'MA':st;}

      <h3 class="disp" style="font-family:Georgia,serif;color:#40617a;font-weight:400;">${L('Restaurant Address','餐厅地址')}</h3>

      <label class="f">${L('Address Line 2','地址第 2 行')}</label><input class="t" id="a2" value="${a.line2||''}">

      <label class="f">${L('State','州')}</label><select class="t" id="as"><option ${a.state==='Massachusetts'?'selected':''}>Massachusetts</option><option>Illinois</option><option>California</option></select>
      <label class="f">${L('Zip Code','邮编')}</label><input class="t" id="az" value="${a.zip||''}">

      <label class="f">${L('Email Address (for shipping notifications)','邮箱地址(用于邮寄通知)')}</label><input class="t" value="Downtown@fishermansson.co">
      <label class="f">${L('Contact Phone Number','联系电话')}</label><input class="t" value="781-111-1234">

    </div></div>`;
  } else if(state.plaid==='intro'){
    h=`<div class="overlay"><div class="plaid-intro"><div class="bar"></div><div class="body"><p>${L('Plaid is an easy, secure way to automatically link your bank account with Toast Payroll.','Plaid 是一种简单、安全的方式,可自动将你的银行账户与 Toast Payroll 关联。')}</p><button class="plaid-connect" onclick="plaidConnect()">${L('Connect','连接')}</button><button class="plaid-cancel" onclick="closePlaid()">${L('Cancel','取消')}</button></div></div></div>`;
  } else if(state.plaid==='inst'){
    const banks=['TD','BANK OF AMERICA','CHASE','Citizens','Santander','Capital One','Eastern Bank','DCU','WELLS FARGO','citibank','US bank','USAA'];
    h=`<div class="overlay"><div class="plaid-inst"><div class="ph"><span style="cursor:pointer;color:#666;" onclick="state.plaid='intro';render()">←</span><b style="letter-spacing:1px;">✳ PLAID</b><span class="x" onclick="closePlaid()">✕</span></div><div class="pb"><h4>${L('Select your institution','选择你的开户行')}</h4><input class="plaid-search" placeholder="${L('Search for 12,000+ Institutions','搜索 12,000+ 家机构')}"><div class="banks">${banks.map(b=>`<div class="bank">${b}</div>`).join('')}</div></div></div></div>`;
  }
  document.getElementById('modal').innerHTML=h;
}

function saveState(){try{localStorage.setItem('toastClone',JSON.stringify({step:state.step,lang:state.lang,fein:state.fein,stategrp:state.stategrp,paid:state.paid,payGroups:state.payGroups,locations:state.locations}));}catch(e){}}
function loadState(){try{const j=localStorage.getItem('toastClone');if(j){Object.assign(state,JSON.parse(j));state.plaid=null;state.editLoc=null;}}catch(e){}}
function resetAll(){try{localStorage.removeItem('toastClone');}catch(e){}const lang=state.lang;state.step='welcome';state.plaid=null;state.editLoc=null;state.fein=1;state.stategrp=1;state.paid=null;state.payGroups=1;state.lang=lang;state.locations=[{name:'Down Town',company:null,addr:null,jobs:[...JOBS5]},{name:'Lighthouse Road',company:null,addr:null,jobs:['','','']}];render();}

function render(){
  const en=state.lang==='en';
  document.getElementById('langtog').innerHTML=`<b class="${en?'on':'off'}" onclick="setLang('en')">EN</b> <span style="color:#ccc;">|</span> <b class="${en?'off':'on'}" onclick="setLang('zh')">中文</b>`;
  document.getElementById('resetlink').textContent=L('↺ Start over','↺ 重新开始');
  renderSidebar();
  document.getElementById('main').innerHTML=screen();
  renderModal();
  document.getElementById('pfill').style.width=Math.round(idx()/(STEPS.length-1)*100)+'%';
  const showNote=['tax1','tax2','tax3','tax4','tax5','loc2','loc_worktax'].includes(state.step);
  document.getElementById('note').innerHTML=showNote?`<div class="notebar">${L('Note: The information entered into RID during this video is for example purposes only. Tax, Location &amp; Jobs, and Payroll information are unique to each operation and should represent your use cases.','注意:本视频中在 RID 里输入的信息仅为示例。税务、门店与岗位、薪资信息因各家运营而异,应以你的实际情况为准。')}</div>`:'';
  saveState();
}
loadState();render();
</script>
