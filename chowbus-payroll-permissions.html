<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 权限管理</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  [hidden]{display:none!important;}
  .page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .page-title{font-size:22px;font-weight:800;color:var(--t1);}
  .page-sub{font-size:13.5px;color:var(--t2);margin-bottom:18px;}
  .btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-add:hover{background:var(--brand-hover);}

  .list-card{background:var(--surface);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;}
  .tbl-wrap{overflow-x:auto;}
  table.pm{width:100%;border-collapse:collapse;min-width:820px;}
  table.pm thead th{font-size:13px;font-weight:500;color:#9ca3af;text-align:left;padding:13px 18px;background:#fafafa;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.pm tbody td{padding:16px 18px;font-size:14px;color:var(--t1);border-bottom:1px solid #f1f2f4;vertical-align:top;}
  table.pm tbody tr:last-child td{border-bottom:none;}
  table.pm tbody tr:hover{background:#fcfcfd;}
  .r-name{font-weight:700;}
  .r-mut{color:var(--t2);}
  .r-perms{display:flex;flex-wrap:wrap;gap:6px;}
  .r-pill{background:#eef0fe;color:#4a52c0;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;}
  .r-pill.all{background:#fff0f5;color:var(--brand);}
  .r-acts{display:flex;gap:8px;white-space:nowrap;}
  .act-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tb);cursor:pointer;}
  .act-btn:hover{border-color:var(--brand);color:var(--brand);}
  .act-btn.del:hover{border-color:#dc2626;color:#dc2626;}
  .mem{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#f1f2f4;color:var(--tb);font-size:12.5px;font-weight:700;}

  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:1200;}
  .ov.open{display:flex;}
  .modal{background:#fff;border-radius:16px;width:560px;max-width:calc(100vw - 40px);box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .m-h{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 4px;}
  .m-t{font-size:19px;font-weight:800;color:var(--t1);}
  .m-x{border:none;background:transparent;font-size:20px;color:var(--t2);cursor:pointer;}
  .m-body{padding:16px 26px 4px;}
  .m-fld{margin-bottom:16px;}
  .m-lb{font-size:13px;font-weight:700;color:var(--tb);margin-bottom:6px;display:block;}
  .m-lb .rq{color:var(--brand);}
  .m-inp{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;padding:0 12px;font-size:14px;color:var(--t1);font-family:inherit;}
  .m-inp:focus{outline:none;border-color:var(--brand);}
  .perm-grid{display:flex;flex-direction:column;gap:2px;}
  .perm-row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid #f4f5f6;font-size:14px;color:var(--t1);cursor:pointer;}
  .perm-row:last-child{border-bottom:none;}
  .perm-cb{width:19px;height:19px;border:1.7px solid #c4c8cf;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
  .perm-row.on .perm-cb{background:var(--brand);border-color:var(--brand);}
  .perm-row.locked{cursor:not-allowed;opacity:.75;}
  .perm-row.locked .perm-cb{background:#e9eaee;border-color:#dfe1e6;color:#9aa0aa;}
  .perm-row.locked.on .perm-cb{background:var(--brand);border-color:var(--brand);color:#fff;opacity:.7;}
  /* 关联员工 多选弹窗 */
  .as-list{padding:12px 26px 6px;max-height:340px;overflow-y:auto;}
  .as-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F1F2F4;font-size:14.5px;color:var(--t1);cursor:pointer;}
  .as-row:last-child{border-bottom:none;}
  .as-cb{width:19px;height:19px;border:1.7px solid #c4c8cf;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
  .as-row.on .as-cb{background:var(--brand);border-color:var(--brand);}
  .as-role{margin-left:auto;font-size:12.5px;color:#9ca3af;}
  .m-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 26px 22px;}
  .m-foot button{border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  .m-cancel{background:#fff;border:1px solid #DCDCDC;color:var(--tb);}
  .m-save{background:var(--brand);border:1px solid var(--brand);color:#fff;}
  .m-save:hover{background:var(--brand-hover);}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:1500;transition:all .3s cubic-bezier(.2,.8,.3,1);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="page-head">
          <h1 class="page-title"><span class="zh">权限管理</span><span class="en">Permissions</span></h1>
          <button class="btn-add" onclick="openAdd()"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg><span class="zh">添加角色</span><span class="en">Add role</span></button>
        </div>
        <div class="page-sub"><span class="zh">为不同角色分配可访问的薪酬功能范围。</span><span class="en">Assign which payroll features each role can access.</span></div>

        <div class="list-card">
          <div class="tbl-wrap">
            <table class="pm">
              <thead><tr>
                <th><span class="zh">角色</span><span class="en">Role</span></th>
                <th><span class="zh">说明</span><span class="en">Description</span></th>
                <th><span class="zh">成员</span><span class="en">Members</span></th>
                <th><span class="zh">权限范围</span><span class="en">Access</span></th>
                <th><span class="zh">操作</span><span class="en">Action</span></th>
              </tr></thead>
              <tbody id="pmBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 添加/编辑角色 弹窗 -->
<div class="ov" id="roleOverlay">
  <div class="modal">
    <div class="m-h"><div class="m-t" id="roleTitle"><span class="zh">添加角色</span><span class="en">Add role</span></div><button class="m-x" onclick="closeRole()">✕</button></div>
    <div class="m-body">
      <div class="m-fld"><label class="m-lb"><span class="zh">角色名称</span><span class="en">Role name</span> <span class="rq">*</span></label><input class="m-inp" id="rName" placeholder="例如：财务查看"></div>
      <div class="m-fld"><label class="m-lb"><span class="zh">说明</span><span class="en">Description</span></label><input class="m-inp" id="rDesc" placeholder="该角色的职责说明"></div>
      <div class="m-fld"><label class="m-lb"><span class="zh">权限范围</span><span class="en">Access</span></label>
        <div class="perm-grid" id="permGrid"></div>
      </div>
    </div>
    <div class="m-foot"><button class="m-cancel" onclick="closeRole()"><span class="zh">取消</span><span class="en">Cancel</span></button><button class="m-save" onclick="saveRole()"><span class="zh">保存</span><span class="en">Save</span></button></div>
  </div>
</div>

<!-- 关联员工 多选弹窗 -->
<div class="ov" id="assocOverlay">
  <div class="modal">
    <div class="m-h"><div class="m-t"><span class="zh">关联员工</span><span class="en">Link staff</span></div><button class="m-x" onclick="closeAssoc()">✕</button></div>
    <div class="page-sub" style="padding:6px 26px 0;margin:0;"><span class="zh">为「<b id="assocRole"></b>」选择拥有该角色的员工（可多选）。</span><span class="en">Select staff who have the <b id="assocRoleEn"></b> role.</span></div>
    <div class="as-list" id="assocList"></div>
    <div class="m-foot"><button class="m-cancel" onclick="closeAssoc()"><span class="zh">取消</span><span class="en">Cancel</span></button><button class="m-save" onclick="saveAssoc()"><span class="zh">保存</span><span class="en">Save</span></button></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="cb-shell.js"></script>
<script>
  renderShell('perm');
  function bi(zh,en){ return '<span class="zh">'+zh+'</span><span class="en">'+en+'</span>'; }

  const PERMS=[
    {key:'setup',   zh:'初始化设置', en:'Payroll Setup'},
    {key:'company', zh:'公司设置',   en:'Company Setup'},
    {key:'employees',zh:'发薪员工管理',en:'Payroll Employees'},
    {key:'run',     zh:'跑薪',       en:'Run Payroll'},
    {key:'taxes',   zh:'税务与申报', en:'Taxes & Filings'},
    {key:'multi',   zh:'多公司管理', en:'Multi-company'},
    {key:'perm',    zh:'权限管理',   en:'Permissions'},
  ];
  const ALL = PERMS.map(p=>p.key);
  let ROLES=[
    {name:'超级管理员', nameEn:'Super Admin', desc:'全部薪酬功能与设置', descEn:'Full access to all payroll features', members:2, perms:[...ALL], sys:true},
    {name:'薪酬管理员', nameEn:'Payroll Admin', desc:'日常跑薪与员工管理', descEn:'Run payroll and manage employees', members:3, perms:['setup','company','employees','run','taxes']},
    {name:'财务查看',   nameEn:'Finance Viewer', desc:'仅查看税务与申报', descEn:'View taxes & filings only', members:1, perms:['taxes']},
  ];

  function permsCell(r){
    if(r.perms.length===ALL.length) return '<span class="r-pill all">'+bi('全部功能','All features')+'</span>';
    return '<div class="r-perms">'+r.perms.map(k=>{const p=PERMS.find(x=>x.key===k);return '<span class="r-pill">'+bi(p.zh,p.en)+'</span>';}).join('')+'</div>';
  }
  function render(){
    document.getElementById('pmBody').innerHTML = ROLES.map((r,i)=>
      '<tr>'+
        '<td class="r-name"><span class="zh">'+r.name+'</span><span class="en">'+r.nameEn+'</span></td>'+
        '<td class="r-mut"><span class="zh">'+r.desc+'</span><span class="en">'+r.descEn+'</span></td>'+
        '<td><span class="mem">'+r.members+'</span></td>'+
        '<td>'+permsCell(r)+'</td>'+
        '<td><div class="r-acts"><button class="act-btn" onclick="openAssoc('+i+')">'+bi('关联员工','Link staff')+'</button>'+
          '<button class="act-btn" onclick="openEdit('+i+')">'+bi('编辑','Edit')+'</button>'+
          (i===0?'':'<button class="act-btn del" onclick="delRole('+i+')">'+bi('删除','Delete')+'</button>')+'</div></td>'+
      '</tr>').join('');
  }
  render();

  let editIdx=null, sel=new Set(), lockPerms=false;
  function isSingle(){ try{ return localStorage.getItem('cbInitMode')==='single'; }catch(e){ return false; } }
  function visiblePerms(){ return PERMS.filter(function(p){ return !(p.key==='multi' && isSingle()); }); }   // 单店隐藏「多公司管理」
  function renderPerms(){
    const CK='<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14l8-8"/></svg>';
    document.getElementById('permGrid').innerHTML = visiblePerms().map(p=>
      '<div class="perm-row '+(sel.has(p.key)?'on':'')+(lockPerms?' locked':'')+'" '+(lockPerms?'':'onclick="togglePerm(\''+p.key+'\')"')+'><span class="perm-cb">'+(sel.has(p.key)?CK:'')+'</span>'+bi(p.zh,p.en)+'</div>').join('');
  }
  function togglePerm(k){ if(lockPerms) return; sel.has(k)?sel.delete(k):sel.add(k); renderPerms(); }
  function openAdd(){ editIdx=null; lockPerms=false; sel=new Set(); document.getElementById('roleTitle').innerHTML=bi('添加角色','Add role'); document.getElementById('rName').value=''; document.getElementById('rDesc').value=''; renderPerms(); document.getElementById('roleOverlay').classList.add('open'); }
  function openEdit(i){ editIdx=i; const r=ROLES[i]; lockPerms=!!r.sys; sel = r.sys ? new Set(visiblePerms().map(p=>p.key)) : new Set(r.perms); document.getElementById('roleTitle').innerHTML=bi(r.sys?'查看角色':'编辑角色', r.sys?'View role':'Edit role'); document.getElementById('rName').value=r.name; document.getElementById('rDesc').value=r.desc; renderPerms(); document.getElementById('roleOverlay').classList.add('open'); }
  function closeRole(){ document.getElementById('roleOverlay').classList.remove('open'); }
  function saveRole(){
    const name=document.getElementById('rName').value.trim();
    if(!name){ showToast('请填写角色名称','Please enter a role name'); return; }
    const desc=document.getElementById('rDesc').value.trim();
    if(editIdx!=null){ Object.assign(ROLES[editIdx], {name, nameEn:name, desc, descEn:desc, perms:[...sel]}); }
    else { ROLES.push({name, nameEn:name, desc, descEn:desc, members:0, perms:[...sel]}); }
    closeRole(); render(); showToast('角色已保存','Role saved');
  }
  function delRole(i){ ROLES.splice(i,1); render(); showToast('角色已删除','Role deleted'); }

  /* ===== 关联员工 ===== */
  const STAFF=[
    {name:'Bohong Xu', role:'超级管理员', roleEn:'Super Admin'},
    {name:'Ruiqi Zhang', role:'经理', roleEn:'Manager'},
    {name:'Wei Huang', role:'餐厅老板', roleEn:'Owner'},
    {name:'Yang Feng', role:'收银员', roleEn:'Cashier'},
    {name:'Yiran Chen', role:'经理', roleEn:'Manager'},
    {name:'Maria Lopez', role:'服务员', roleEn:'Server'},
    {name:'Kenji Tanaka', role:'厨师', roleEn:'Cook'},
  ];
  let assocIdx=null, assocSel=new Set();
  function openAssoc(i){ assocIdx=i; assocSel=new Set(ROLES[i].staff||[]); document.getElementById('assocRole').textContent=ROLES[i].name; document.getElementById('assocRoleEn').textContent=ROLES[i].nameEn; assocRender(); document.getElementById('assocOverlay').classList.add('open'); }
  function closeAssoc(){ document.getElementById('assocOverlay').classList.remove('open'); }
  function assocToggle(i){ assocSel.has(i)?assocSel.delete(i):assocSel.add(i); assocRender(); }
  function assocRender(){
    document.getElementById('assocList').innerHTML = STAFF.map((e,i)=>
      '<div class="as-row '+(assocSel.has(i)?'on':'')+'" onclick="assocToggle('+i+')"><span class="as-cb">'+(assocSel.has(i)?'<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14l8-8"/></svg>':'')+'</span>'+e.name+'<span class="as-role">'+(document.body.classList.contains('lang-en')?e.roleEn:e.role)+'</span></div>').join('');
  }
  function saveAssoc(){
    if(assocIdx!=null){ ROLES[assocIdx].staff=[...assocSel]; ROLES[assocIdx].members=assocSel.size; }
    closeAssoc(); render(); showToast('已关联 '+assocSel.size+' 名员工', assocSel.size+' staff linked');
  }

  function showToast(zh,en){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=document.body.classList.contains('lang-en')?en:zh; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
</script>
</body>
</html>
