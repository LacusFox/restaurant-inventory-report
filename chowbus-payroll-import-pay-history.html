<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 导入历史发薪</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  :root{--ck:#2b4eff;--ck-hover:#2140db;}
  /* 白色底内嵌页 */
  .cb-scroll{background:#fff;}
  .cb-content{max-width:100%;padding:0;}
  .ip-top{padding:14px 24px 0;}
  .crumb{font-size:12.5px;color:#9aa0aa;cursor:pointer;display:inline-block;}
  .crumb:hover{color:var(--brand);}
  .ip-wrap{max-width:760px;margin:0 auto;padding:20px 24px 60px;}

  .ip-banner{display:flex;gap:14px;background:#EEF4FF;border:1px solid #D9E4FB;border-radius:12px;padding:16px 18px;margin-bottom:28px;}
  .ip-banner .bi{color:var(--ck);flex:0 0 auto;}
  .ip-banner b{color:#1e2a52;font-size:15px;}
  .ip-banner .d{color:#41527e;font-size:14px;line-height:1.55;margin-top:3px;}

  .ip-h1{font-size:24px;font-weight:800;color:#111;margin-bottom:8px;}
  .ip-sub{font-size:15px;color:#6b7280;line-height:1.6;margin-bottom:26px;}
  .ip-q{font-size:16px;font-weight:800;color:#111;}
  .ip-req{color:#e0455e;}
  .ip-help{font-size:14px;color:#6b7280;line-height:1.55;margin:8px 0 14px;}
  .ip-select{width:100%;padding:13px 15px;border:1px solid #DADCE0;border-radius:10px;font-size:15px;color:#111;background:#fff;font-family:var(--font);appearance:none;cursor:pointer;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%239aa0aa' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
  .ip-select:focus{outline:none;border-color:var(--ck);box-shadow:0 0 0 3px rgba(43,78,255,.12);}
  .ip-btn{width:100%;background:var(--ck);color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px;}
  .ip-btn:hover{background:var(--ck-hover);}
  .ip-btn.ghost{background:#fff;color:#111;border:1px solid #DADCE0;}
  .ip-btn.ghost:hover{background:#f7f8fa;}
  .ip-actions{display:flex;gap:12px;margin-top:24px;}
  .ip-actions .ip-btn{margin-top:0;}

  /* 录入表 */
  .ip-freqtag{display:inline-block;background:#EEF0FF;color:var(--ck);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:18px;}
  table.ip-tbl{width:100%;border-collapse:collapse;}
  .ip-tbl th{text-align:left;font-size:13px;font-weight:800;color:#111;padding:12px 10px;border-bottom:1px solid #EDEEF1;}
  .ip-tbl th.n,.ip-tbl td.n{text-align:right;}
  .ip-tbl td{padding:12px 10px;border-bottom:1px solid #F1F2F4;font-size:14px;color:#111;vertical-align:middle;}
  .ip-tbl .nm{font-weight:700;}
  .ip-in{width:120px;padding:9px 11px;border:1px solid #DADCE0;border-radius:9px;font-size:14px;color:#111;text-align:right;font-family:var(--font);}
  .ip-in:focus{outline:none;border-color:var(--ck);box-shadow:0 0 0 3px rgba(43,78,255,.12);}

  .ip-done{text-align:center;padding:70px 20px;}
  .ip-done-ic{width:58px;height:58px;border-radius:50%;background:#EAF7F0;color:#12905a;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .ip-done-h{font-size:22px;font-weight:800;color:#111;margin-bottom:8px;}
  .ip-done-d{font-size:15px;color:#6b7280;margin-bottom:24px;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;border-radius:10px;padding:12px 18px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:1000;transition:all .3s cubic-bezier(.2,.8,.3,1);font-size:14px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <div class="ip-top"><span class="crumb" onclick="location.href='chowbus-payroll-company-setup.html'"><span class="zh">← 返回公司设置</span><span class="en">← Back to Company Setup</span></span></div>
        <div class="ip-wrap" id="ipApp"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="cb-shell.js"></script>
<script>
  renderShell('company');

  let ipStep=1, ipFreq='';
  const ROSTER=['Qiyi Gong','Dan Boyle','Aisha Khan'];
  const ipData={};   // name -> {gross, tax, net}

  function ipSetFreq(v){ ipFreq=v; }
  function ipContinue(){ if(!ipFreq){ showToast('Please select a pay frequency'); return; } ipStep=2; render(); }
  function ipBack(){ ipStep=1; render(); }
  function ipSet(name, field, v){ (ipData[name]=ipData[name]||{})[field]=v; }
  function ipSave(){ ipStep=3; render(); }

  function render(){
    document.getElementById('ipApp').innerHTML = ipStep===1 ? renderStep1() : ipStep===2 ? renderStep2() : renderDone();
  }

  function renderStep1(){
    return `
      <div class="ip-banner">
        <svg class="bi" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <div><b>You'll need 2026 pay records to get started.</b><div class="d">You can download these from your existing payroll provider.</div></div>
      </div>
      <div class="ip-h1">Enter pay history</div>
      <div class="ip-sub">For accurate tax filing, we'll need 2026 pay history records from your existing payroll provider.</div>
      <div class="ip-q">How often did you pay your team in 2026? <span class="ip-req">*</span></div>
      <div class="ip-help">Select the frequency employees are paid on a regular, recurring basis.</div>
      <select class="ip-select" onchange="ipSetFreq(this.value)">
        <option value="" ${ipFreq===''?'selected':''} disabled hidden>Select</option>
        ${['Weekly','Biweekly','Semi-monthly','Monthly','Quarterly','Annually'].map(f=>`<option ${ipFreq===f?'selected':''}>${f}</option>`).join('')}
      </select>
      <button class="ip-btn" onclick="ipContinue()">Continue</button>`;
  }

  function renderStep2(){
    const rows = ROSTER.map(n=>{
      const d=ipData[n]||{};
      return `<tr>
        <td class="nm">${n}</td>
        <td class="n"><input class="ip-in" placeholder="$0.00" value="${d.gross||''}" oninput="ipSet('${n}','gross',this.value)"></td>
        <td class="n"><input class="ip-in" placeholder="$0.00" value="${d.tax||''}" oninput="ipSet('${n}','tax',this.value)"></td>
        <td class="n"><input class="ip-in" placeholder="$0.00" value="${d.net||''}" oninput="ipSet('${n}','net',this.value)"></td>
      </tr>`;
    }).join('');
    return `
      <span class="ip-freqtag">${ipFreq} · 2026</span>
      <div class="ip-h1">Enter 2026 pay history</div>
      <div class="ip-sub">Enter each employee's year-to-date totals as of your switch to Chowbus. These keep tax filings accurate.</div>
      <table class="ip-tbl">
        <thead><tr><th>Employee</th><th class="n">YTD gross</th><th class="n">Taxes withheld</th><th class="n">YTD net</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="ip-actions">
        <button class="ip-btn ghost" onclick="ipBack()">Back</button>
        <button class="ip-btn" onclick="ipSave()">Save pay history</button>
      </div>`;
  }

  function renderDone(){
    return `<div class="ip-done">
      <div class="ip-done-ic">✓</div>
      <div class="ip-done-h">Pay history imported</div>
      <div class="ip-done-d">Your 2026 pay history has been saved. Year-to-date totals and tax filings will stay accurate.</div>
      <button class="ip-btn" style="max-width:300px;margin:0 auto;" onclick="location.href='chowbus-payroll-company-setup.html'">Back to Company Setup</button>
    </div>`;
  }

  function showToast(t){ const el=document.getElementById('toast'); document.getElementById('toastMsg').textContent=t; el.classList.add('show'); clearTimeout(el._tm); el._tm=setTimeout(()=>el.classList.remove('show'),2400); }

  render();
</script>
</body>
</html>
