<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowbus Payroll · 跑薪记录</title>
<link rel="stylesheet" href="cb-inter.css">
<link rel="stylesheet" href="cb-shell.css">
<style>
  .crumb{font-size:12.5px;color:#9aa0aa;margin-bottom:12px;cursor:pointer;display:inline-block;}
  .crumb:hover{color:var(--primary);}
  .page-title{font-size:23px;font-weight:800;margin-bottom:18px;}

  /* 列表 */
  .rec-list{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;max-width:960px;box-shadow:0 2px 12px rgba(0,0,0,.03);}
  .rec-head{display:grid;grid-template-columns:1.4fr 1fr 1fr 90px 24px;gap:16px;padding:14px 22px;background:#FAFBFC;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:800;color:#9aa0aa;letter-spacing:.02em;}
  .rec-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 90px 24px;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid #F1F2F4;cursor:pointer;transition:.12s;}
  .rec-row:last-child{border-bottom:none;}
  .rec-row:hover{background:#fff0f5;}
  .rec-range{font-size:15px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums;}
  .rec-cell{font-size:14px;color:#4b5563;font-variant-numeric:tabular-nums;}
  .rec-cell.net{font-weight:700;color:#111;}
  .rec-paid{justify-self:start;font-size:12.5px;font-weight:700;color:#12905a;background:#EAF7F0;border:1px solid #CBEBD9;border-radius:999px;padding:3px 12px;}
  .rec-arrow{justify-self:end;color:#c4c8cf;font-size:18px;}
  .rec-head .num,.rec-row .num{text-align:left;}

  /* 详情（内嵌 Check Payroll summary） */
  .pr-detail{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.03);display:flex;overflow:hidden;min-height:520px;}
  .pr-side{width:250px;flex:0 0 auto;border-right:1px solid #EFF0F3;padding:24px 22px;}
  .pr-paid{display:inline-block;font-size:12.5px;font-weight:700;color:#12905a;background:#EAF7F0;border-radius:999px;padding:4px 12px;margin-bottom:14px;}
  .pr-side h3{font-size:18px;font-weight:800;margin-bottom:18px;}
  .pr-cash-l{font-size:12px;font-weight:700;color:#9aa0aa;letter-spacing:.04em;display:flex;align-items:center;gap:6px;}
  .pr-cash-v{font-size:30px;font-weight:900;margin:6px 0 18px;}
  .pr-hr{height:1px;background:#EFF0F3;margin:0 0 18px;}
  .pr-kv{margin-bottom:16px;} .pr-kv .k{font-size:13px;color:#9aa0aa;margin-bottom:3px;} .pr-kv .v{font-size:15px;font-weight:700;color:#111;line-height:1.4;}
  .pr-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .pr-main{flex:1;padding:22px 26px;overflow-x:auto;}
  .pr-top{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .pr-back{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#111;cursor:pointer;}
  .pr-reopen{margin-left:auto;background:#fff;border:1px solid #DADCE0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .pr-reopen:hover{background:#f3f4f6;}
  .pr-tabs{display:inline-flex;background:#F4F5F7;border-radius:999px;padding:5px;margin-bottom:22px;flex-wrap:wrap;}
  .pr-tab{font-size:13.5px;font-weight:700;color:#8a8f9a;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .pr-tab.active{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1);}
  table.pr-table{width:100%;border-collapse:collapse;min-width:640px;}
  .pr-table th{text-align:left;font-size:14px;font-weight:800;color:#111;padding:14px 12px;border-bottom:1px solid var(--border);}
  .pr-table th.num,.pr-table td.num{text-align:right;}
  .pr-table td{padding:16px 12px;border-bottom:1px solid #F1F2F4;font-size:15px;color:#111;}
  .pr-table tr:last-child td{border-bottom:none;}
  .pr-table .nm{font-weight:700;}
  .pr-empty{padding:80px 10px;text-align:center;}
  .pr-empty .t{font-size:20px;font-weight:800;color:#111;margin-bottom:10px;} .pr-empty .d{font-size:15px;color:#9aa0aa;}
</style>
</head>
<body class="lang-zh">

<div class="cb-app">
  <main class="cb-main">
    <div class="cb-scroll">
      <div class="cb-content">
        <span class="crumb" onclick="location.href='chowbus-payroll-run-payroll.html'"><span class="zh">← 返回跑薪</span><span class="en">← Back to Run Payroll</span></span>
        <h1 class="page-title"><span class="zh">跑薪记录</span><span class="en">Payroll Records</span></h1>
        <div id="recBody"></div>
      </div>
    </div>
  </main>
</div>

<script src="cb-shell.js"></script>
<script>
  renderShell('run');
  /* 8 条历史跑薪，按时间倒序（内容英文，内嵌 Check Payroll summary） */
  const RUNS=[
    {range:'2026/8/11 – 8/17', pay:'2026/8/22', reopen:'2026/8/20 8:00 am PT'},
    {range:'2026/8/4 – 8/10',  pay:'2026/8/15', reopen:'2026/8/13 8:00 am PT'},
    {range:'2026/7/28 – 8/3',  pay:'2026/8/8',  reopen:'2026/8/6 8:00 am PT'},
    {range:'2026/7/21 – 7/27', pay:'2026/8/1',  reopen:'2026/7/30 8:00 am PT'},
    {range:'2026/7/14 – 7/20', pay:'2026/7/25', reopen:'2026/7/23 8:00 am PT'},
    {range:'2026/7/7 – 7/13',  pay:'2026/7/18', reopen:'2026/7/16 8:00 am PT'},
    {range:'2026/6/30 – 7/6',  pay:'2026/7/11', reopen:'2026/7/9 8:00 am PT'},
    {range:'2026/6/23 – 6/29', pay:'2026/7/4',  reopen:'2026/7/2 8:00 am PT'},
  ];
  let prTab='pay';

  function renderList(){
    document.getElementById('recBody').innerHTML =
      `<div class="rec-list">
        <div class="rec-head">
          <span><span class="zh">发薪周期</span><span class="en">Pay period</span></span>
          <span><span class="zh">发薪日</span><span class="en">Pay day</span></span>
          <span><span class="zh">实发合计</span><span class="en">Net pay</span></span>
          <span><span class="zh">状态</span><span class="en">Status</span></span>
          <span></span>
        </div>` +
      RUNS.map((r,i)=>`
        <div class="rec-row" onclick="openRun(${i})">
          <span class="rec-range">${r.range}</span>
          <span class="rec-cell">${r.pay}</span>
          <span class="rec-cell net">$327.92</span>
          <span class="rec-paid">Paid</span>
          <span class="rec-arrow">›</span>
        </div>`).join('') + `</div>`;
  }

  function openRun(i){ prTab='pay'; renderDetail(RUNS[i]); window.scrollTo({top:0,behavior:'smooth'}); }

  function prTabContent(){
    if(prTab==='pay') return `<table class="pr-table">
      <thead><tr><th>Employee</th><th>Payment Method</th><th class="num">Earnings</th><th class="num">Add'l earnings</th><th class="num">Total reimb.</th><th class="num">PTO/Sick leave</th><th class="num">Gross pay</th><th class="num">Net pay</th></tr></thead>
      <tbody><tr><td class="nm">Qiyi Gong</td><td>Direct Deposit</td><td class="num">$375.00</td><td class="num">$0.00</td><td class="num">$0.00</td><td class="num">$0.00</td><td class="num">$375.00</td><td class="num">$327.92</td></tr></tbody></table>`;
    if(prTab==='taxes') return `<table class="pr-table">
      <thead><tr><th>Tax Description</th><th class="num">by Employees</th><th class="num">by Company</th></tr></thead>
      <tbody>
        <tr><td>Federal Unemployment Tax</td><td class="num">—</td><td class="num">$2.25</td></tr>
        <tr><td>Employer Medicare Tax</td><td class="num">—</td><td class="num">$5.44</td></tr>
        <tr><td>Illinois State Unemployment Tax</td><td class="num">—</td><td class="num">$7.50</td></tr>
        <tr><td>Medicare</td><td class="num">$5.44</td><td class="num">—</td></tr>
        <tr><td>Additional Medicare</td><td class="num">—</td><td class="num">—</td></tr>
        <tr><td>Federal Income Tax</td><td class="num">$23.08</td><td class="num">—</td></tr>
        <tr><td>Illinois State Tax</td><td class="num">$18.56</td><td class="num">—</td></tr>
      </tbody></table>`;
    if(prTab==='hourly') return `<table class="pr-table">
      <thead><tr><th>Employee</th><th class="num">Regular</th><th class="num">OT</th><th class="num">Double OT</th><th class="num">PTO</th><th class="num">Sick</th></tr></thead>
      <tbody><tr><td class="nm">Qiyi Gong</td><td class="num">30.00</td><td class="num">5.00</td><td class="num">0.00</td><td class="num">0.00</td><td class="num">0.00</td></tr></tbody></table>`;
    if(prTab==='posttax') return `<div class="pr-empty"><div class="t">No post-tax deductions</div><div class="d">This payroll has no post-tax deductions to show.</div></div>`;
    return `<div class="pr-empty"><div class="t">No benefits</div><div class="d">This payroll has no benefits to show.</div></div>`;
  }
  function setPrTab(t){ prTab=t; document.getElementById('prContent').innerHTML=prTabContent(); document.querySelectorAll('.pr-tab').forEach(el=>el.classList.toggle('active', el.dataset.t===t)); }

  function renderDetail(r){
    document.getElementById('recBody').innerHTML = `
      <div class="pr-detail">
        <aside class="pr-side">
          <span class="pr-paid">Paid</span>
          <h3>Payroll summary</h3>
          <div class="pr-cash-l">CASH REQUIREMENT ›</div>
          <div class="pr-cash-v">$390.19</div>
          <div class="pr-hr"></div>
          <div class="pr-kv"><div class="k">Pay period</div><div class="v">${r.range.replace(' – ','<br>– ')}</div></div>
          <div class="pr-kv"><div class="k">Pay day</div><div class="v">${r.pay}</div></div>
          <div class="pr-kv"><div class="k">Reopen deadline</div><div class="v">${r.reopen.replace(' ','<br>')}</div></div>
          <div class="pr-two">
            <div class="pr-kv"><div class="k">Employees</div><div class="v">1</div></div>
            <div class="pr-kv"><div class="k">Contractors</div><div class="v">0</div></div>
          </div>
        </aside>
        <div class="pr-main">
          <div class="pr-top">
            <span class="pr-back" onclick="renderList()">‹ View other payrolls</span>
            <button class="pr-reopen" onclick="prToast('Reopen payroll (demo)')">Reopen payroll</button>
          </div>
          <div class="pr-tabs">
            <span class="pr-tab active" data-t="pay" onclick="setPrTab('pay')">Pay breakdown</span>
            <span class="pr-tab" data-t="taxes" onclick="setPrTab('taxes')">Taxes</span>
            <span class="pr-tab" data-t="hourly" onclick="setPrTab('hourly')">Hourly breakdown</span>
            <span class="pr-tab" data-t="posttax" onclick="setPrTab('posttax')">Post-tax deductions</span>
            <span class="pr-tab" data-t="benefits" onclick="setPrTab('benefits')">Benefits</span>
          </div>
          <div id="prContent">${prTabContent()}</div>
        </div>
      </div>`;
  }
  function prToast(t){ alert(t); }

  renderList();
</script>
</body>
</html>
